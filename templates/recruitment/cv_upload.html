<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload CV - ATS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0">📄 Upload et analyse de CV</h3>
                    </div>
                    <div class="card-body">
                        <!-- Messages Django -->
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <!-- Formulaire upload -->
                        <form method="post" enctype="multipart/form-data" id="cvUploadForm">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="cv_file" class="form-label">Sélectionner un fichier CV (PDF)</label>
                                <input type="file" class="form-control" id="cv_file" name="cv_file" accept=".pdf" required>
                                <div class="form-text">Formats acceptés: PDF uniquement</div>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary" id="submitBtn">
                                    <span class="spinner-border spinner-border-sm d-none" id="loadingSpinner"></span>
                                    📤 Uploader et analyser
                                </button>
                            </div>
                        </form>

                        <!-- Section parsing texte -->
                        <hr class="my-4">
                        <h5>Ou coller directement le texte du CV</h5>
                        
                        <div class="mb-3">
                            <textarea class="form-control" id="cvTextArea" rows="6" placeholder="Collez ici le texte de votre CV..."></textarea>
                        </div>
                        
                        <button type="button" class="btn btn-secondary" id="parseTextBtn">
                            🔍 Analyser le texte
                        </button>
                        
                        <!-- Résultat parsing texte -->
                        <div id="parseResult" class="mt-3 d-none">
                            <div class="alert alert-info">
                                <h6>Résultat de l'analyse:</h6>
                                <div id="parseResultContent"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-footer">
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'cv_batch_upload' %}" class="btn btn-outline-primary">
                                📁 Upload en lot
                            </a>
                            <a href="{% url 'cv_parsing_stats' %}" class="btn btn-outline-info">
                                📊 Statistiques
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script>
        // Gestion du formulaire upload
        document.getElementById('cvUploadForm').addEventListener('submit', function(e) {
            const submitBtn = document.getElementById('submitBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            submitBtn.disabled = true;
            loadingSpinner.classList.remove('d-none');
        });

        // Gestion parsing texte AJAX
        document.getElementById('parseTextBtn').addEventListener('click', function() {
            const cvText = document.getElementById('cvTextArea').value.trim();
            const parseResult = document.getElementById('parseResult');
            const parseResultContent = document.getElementById('parseResultContent');
            
            if (!cvText) {
                alert('Veuillez saisir du texte CV');
                return;
            }

            this.disabled = true;
            this.innerHTML = '🔄 Analyse en cours...';

            fetch("{% url 'cv_text_parse_ajax' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: JSON.stringify({
                    cv_text: cvText,
                    save_to_db: true
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    parseResultContent.innerHTML = `
                        <strong>✅ Analyse réussie</strong><br>
                        <strong>Candidat:</strong> ${data.candidate_name || 'Non défini'}<br>
                        <strong>Email:</strong> ${data.candidate_email || 'Non défini'}<br>
                        <strong>Confiance:</strong> ${data.parsing_confidence || 0}%<br>
                        <strong>Action:</strong> ${data.created ? 'Créé' : 'Mis à jour'}
                    `;
                    parseResult.className = 'mt-3 alert alert-success';
                } else {
                    parseResultContent.innerHTML = `
                        <strong>❌ Erreur:</strong> ${data.error}
                    `;
                    parseResult.className = 'mt-3 alert alert-danger';
                }
                parseResult.classList.remove('d-none');
            })
            .catch(error => {
                parseResultContent.innerHTML = `
                    <strong>❌ Erreur réseau:</strong> ${error.message}
                `;
                parseResult.className = 'mt-3 alert alert-danger';
                parseResult.classList.remove('d-none');
            })
            .finally(() => {
                this.disabled = false;
                this.innerHTML = '🔍 Analyser le texte';
            });
        });
    </script>
</body>
</html>
